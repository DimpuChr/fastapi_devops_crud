name: FASTAPI CI/CD Pipeline

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: fast-api

jobs:
  # -------------------------
  # 1️⃣ CI Job - Test & Lint
  # -------------------------
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest
          
      - name: Lint with flake8
        run: |
          flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run test
        run: |
          pytest
          

  # -------------------------
  # 2️⃣ CD Job - Docker Build & Push
  # -------------------------

  dockeerpush:
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest .
          docker tag ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest \
          ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

    # -------------------------
    # 3️⃣ Update Helm Repo (GitOps)
    #
  update_helm:
    runs-on: ubuntu-latest
    needs: cd
    steps:
      - name: Install yq
        run: |
          sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/bin/yq
          sudo chmod +x /usr/bin/yq

        # Clone Helm deployment repo
      - name: Clone Helm repo
        run: |
          git clone https://${{ secrets.GIT_TOKEN }}@github.com:DimpuChr/fastapi-chart.git
          cd fastapi-chart

        # Update image tag in values file
      - name: Update image tag
        run: |
          cd fastapi-deploy
          CURRENT_TAG=$(yq e '.image.tag' helm/fastapi-chart/values.yaml)
          
          if [ "$CURRENT_TAG" != "${{ github.sha }}" ]; then
            yq e ".image.tag = \"${{ github.sha }}\"" -i values.yaml
          
            git config user.name "DimpuChr"
            git config user.email "bmdarshan.c@gmail.com"
          
            git add git add values.yaml
            git commit -m "Update image tag to ${{ github.sha }}"
            git push https://${{ secrets.GIT_TOKEN }}@github.com/DimpuChr/fastapi-chart.git main
          
          else
            echo "Image tag already up-to-date. Skipping commit."
          fi